version: '3.8'

services:
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  web:
    build:
      context: ./SMH_Backend
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./SMH_Backend:/app
      - ./SMH_Backend/media:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ./SMH_Backend/.env
    depends_on:
      - redis

  celery:
    build:
      context: ./SMH_Backend
      dockerfile: Dockerfile
    command: celery -A backend worker --loglevel=info -P solo
    volumes:
      - ./SMH_Backend:/app
    env_file:
      - ./SMH_Backend/.env
    depends_on:
      - redis
      - web
